name: Build Native IO Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-native-io-binaries.yml'
      - 'pom.xml'
      - 'paimon-api/**'
      - 'paimon-arrow/**'
      - 'paimon-common/**'
      - 'paimon-core/**'
      - 'paimon-filesystems/**'
      - 'paimon-format/**'
      - 'paimon-native-io/**'
      - 'paimon-spark/**'
      - 'paimon-vfs/**'

env:
  JDK_VERSION: 8
  MAVEN_OPTS: -Xmx4096m -Dmaven.wagon.httpconnectionManager.ttlSeconds=30 -Dmaven.wagon.http.retryHandler.requestSentEnabled=true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Spark 3.4, OBS, Native IO jars
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: temurin
          cache: maven

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            paimon-native-io/rust/target
          key: native-io-cargo-${{ runner.os }}-${{ hashFiles('paimon-native-io/rust/Cargo.lock', 'paimon-native-io/rust/**/Cargo.toml') }}
          restore-keys: |
            native-io-cargo-${{ runner.os }}-

      - name: Build binary jars
        run: |
          mvn -B -ntp clean package \
            -DskipTests \
            -Dmaven.test.skip=true \
            -Drat.skip=true \
            -Dcheckstyle.skip=true \
            -Dspotless.check.skip=true \
            -Pnative-io,spark3 \
            -pl \
              org.apache.paimon:paimon-spark-3.4_2.12,\
              org.apache.paimon:paimon-obs,\
              org.apache.paimon:paimon-native-io \
            -am

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp paimon-spark/paimon-spark-3.4/target/paimon-spark-3.4_2.12-1.4-SNAPSHOT.jar dist/
          cp paimon-filesystems/paimon-obs/target/paimon-obs-1.4-SNAPSHOT.jar dist/
          cp paimon-native-io/target/paimon-native-io-1.4-SNAPSHOT.jar dist/
          test -s dist/paimon-spark-3.4_2.12-1.4-SNAPSHOT.jar
          test -s dist/paimon-obs-1.4-SNAPSHOT.jar
          test -s dist/paimon-native-io-1.4-SNAPSHOT.jar
          jar tf dist/paimon-native-io-1.4-SNAPSHOT.jar | grep 'paimon-native-io/linux/x86_64/'
          ls -lh dist

      - name: Upload binary jars
        uses: actions/upload-artifact@v6
        with:
          name: paimon-native-io-binaries
          path: dist/*.jar
          if-no-files-found: error
