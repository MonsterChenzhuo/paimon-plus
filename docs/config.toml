baseURL = '//monsterchenzhuo.github.io/paimon-plus/'
languageCode = 'en-us'
title = 'Paimon Plus'
enableGitInfo = false
theme = "book"
pygmentsUseClasses = true

[params]
  # Flag whether this is a stable version or not.
  # Used for the quickstart page.
  IsStable = true

  # Flag to indicate whether an outdated warning should be shown.
  ShowOutDatedWarning = false

  # This is the version referenced in the docs. Please only use these variables
  # to reference a specific Paimon version, because this is the only place where
  # we change the version for the complete docs when forking of a release branch
  # etc.
  # The full version string as referenced in Maven (e.g. 1.2.1)
  Version = "1.4.1"

  # For stable releases, leave the bugfix version out (e.g. 1.2). For snapshot
  # release this should be the same as the regular version
  VersionTitle = "plus-main"

  # The branch for this version of Paimon Plus
  Branch = "main"

  # The most recent supported Apache Flink version
  FlinkVersion = "1.20"

  # The github repository for Paimon Plus
  Repo = "//github.com/MonsterChenzhuo/paimon-plus"

  GithubRepo = "https://github.com/MonsterChenzhuo/paimon-plus.git"

  TrinoGithubRepo = "https://github.com/apache/paimon-trino.git"

  PrestoGithubRepo = "https://github.com/apache/paimon-presto.git"

  # This suffix is appended to the Scala-dependent Maven artifact names
  ScalaVersion = "_2.12"

  ProjectHomepage = "//monsterchenzhuo.github.io/paimon-plus/"

  # External links at the bottom
  # of the menu
  MenuLinks = [
    ["Project Homepage", "//monsterchenzhuo.github.io/paimon-plus/"],
    ["GitHub", "//github.com/MonsterChenzhuo/paimon-plus"],
    ["spark-cli", "//github.com/MonsterChenzhuo/spark-cli"],
  ]

  StableDocs = "https://monsterchenzhuo.github.io/paimon-plus/"

  PreviousDocs = []

  BookSection = '/'

[markup]
[markup.goldmark.renderer]
  unsafe = true
