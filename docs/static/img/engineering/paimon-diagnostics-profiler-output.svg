      <g transform="translate(0 57)"><rect width="1560" height="25" fill="#ffffff"/><text x="8" y="18" fill="#d01673">profile-exec-2.html</text><text x="470" y="18">html</text><text x="650" y="18">759.9 KiB</text><text x="860" y="18">2026/05/27 10:35:08</text><text x="1288" y="18" fill="#0076c0">Open</text></g>
      <g transform="translate(0 82)"><rect width="1560" height="25" fill="#eef0f2"/><text x="8" y="18" fill="#d01673">profile-exec-3.html</text><text x="470" y="18">html</text><text x="650" y="18">745.2 KiB</text><text x="860" y="18">2026/05/27 10:35:08</text><text x="1288" y="18" fill="#0076c0">Open</text></g>
      <g transform="translate(0 107)"><rect width="1560" height="25" fill="#ffffff"/><text x="8" y="18" fill="#d01673">profile-exec-4.html</text><text x="470" y="18">html</text><text x="650" y="18">743.9 KiB</text><text x="860" y="18">2026/05/27 10:35:08</text><text x="1288" y="18" fill="#0076c0">Open</text></g>
      <g transform="translate(0 132)"><rect width="1560" height="24" fill="#eef0f2"/><text x="8" y="17" fill="#d01673">profile-exec-5.html</text><text x="470" y="17">html</text><text x="650" y="17">731.5 KiB</text><text x="860" y="17">2026/05/27 10:35:08</text><text x="1288" y="17" fill="#0076c0">Open</text></g>
