    <text x="460" y="24" font-family="Arial, sans-serif" font-size="17" fill="#252a32">html</text>
    <text x="12" y="52" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#252a32">Async Profiler Args</text>
    <text x="460" y="52" font-family="Arial, sans-serif" font-size="17" fill="#252a32">event=wall,interval=10ms</text>
  </g>
