<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Paimon async-profiler output files</title>
  <desc id="desc">A Spark UI profiler page listing executor HTML profiles and an embedded flame graph.</desc>
  <rect width="1600" height="720" fill="#ffffff"/>
  <text x="20" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#252a32">Paimon Profiler</text>
