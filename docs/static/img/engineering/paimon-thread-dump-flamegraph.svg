    <rect y="31" width="1120" height="24" fill="#cbe879"/><text x="8" y="49" font-family="Arial, sans-serif" font-size="15">java.lang.Thread.run(Thread.java:748)</text>
    <rect y="58" width="720" height="24" fill="#9cdf72"/><text x="8" y="76" font-family="Arial, sans-serif" font-size="15">java.util.concurrent.ThreadPoolExecutor$Worker.run</text>
    <rect x="724" y="58" width="340" height="24" fill="#86d3e8"/><text x="734" y="76" font-family="Arial, sans-serif" font-size="15">io.netty.util.concurrent.FastThreadLocalRunnable</text>
    <rect x="1080" y="58" width="390" height="24" fill="#9cdf72"/><text x="1090" y="76" font-family="Arial, sans-serif" font-size="15">org.apache.spark.rpc dispatcher</text>
    <rect y="85" width="390" height="24" fill="#d989e9"/><text x="8" y="103" font-family="Arial, sans-serif" font-size="15">ThreadPoolExecutor.runWorker</text>
