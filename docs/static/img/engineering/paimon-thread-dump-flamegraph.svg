<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Paimon thread dump flame graph</title>
  <desc id="desc">A Spark UI page showing an executor thread dump flame graph.</desc>
  <rect width="1600" height="720" fill="#ffffff"/>
  <rect width="1600" height="54" fill="#ffffff"/>
  <rect y="54" width="1600" height="1" fill="#d9dde3"/>
  <text x="18" y="36" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2b2f36">Spark 3.4.4</text>
  <rect x="880" y="0" width="210" height="54" fill="#e8e8e8"/>
  <text x="902" y="36" font-family="Arial, sans-serif" font-size="22" fill="#343941">Paimon-diagnostics</text>
  <text x="20" y="116" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#252a32">Paimon Thread Dump - 12</text>
  <text x="58" y="156" font-family="Arial, sans-serif" font-size="18" fill="#006db6">Executors | Profiler</text>
  <text x="20" y="204" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#252a32">Executor 12</text>
  <text x="20" y="244" font-family="Arial, sans-serif" font-size="18" fill="#252a32">Updated at 2026/05/27 10:38:36. Samples: 20 threads.</text>
  <text x="20" y="288" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#252a32">Flame Graph</text>
  <g transform="translate(20 314)">
