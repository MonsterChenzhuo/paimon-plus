      <rect x="728" y="142" width="150" height="24" fill="#9be7df"/><text x="736" y="159">SelectorImpl.lock</text>
      <rect x="882" y="142" width="182" height="24" fill="#f0a6d7"/><text x="890" y="159">sun.nio.ch.Selector</text>
