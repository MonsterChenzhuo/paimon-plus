<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex and spark-cli diagnostic workflow</title>
  <desc id="desc">Codex sends Spark application questions to spark-cli. spark-cli collects evidence from Spark History Server, YARN, EventLog storage, and Paimon diagnostics, then returns structured JSON.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07100f"/>
      <stop offset="0.55" stop-color="#0f2b24"/>
      <stop offset="1" stop-color="#26331b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#66e2bc"/>
      <stop offset="1" stop-color="#f5bf55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#66e2bc"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="110" r="220" fill="#66e2bc" opacity="0.08"/>
  <circle cx="150" cy="760" r="260" fill="#f5bf55" opacity="0.07"/>

  <text x="96" y="94" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">spark-cli with Codex</text>
  <text x="96" y="136" fill="#c7d9d1" font-family="Inter, Arial, sans-serif" font-size="22">AI reasoning stays in Codex. Cluster evidence comes from structured spark-cli JSON.</text>

  <g filter="url(#shadow)">
    <rect x="92" y="210" width="330" height="230" rx="18" fill="#ffffff" opacity="0.98"/>
    <text x="124" y="262" fill="#07100f" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Codex</text>
    <text x="124" y="306" fill="#4c5f57" font-family="Inter, Arial, sans-serif" font-size="20">User asks:</text>
    <text x="124" y="340" fill="#17231f" font-family="JetBrains Mono, Menlo, monospace" font-size="20">"Why is app_1527</text>
    <text x="124" y="370" fill="#17231f" font-family="JetBrains Mono, Menlo, monospace" font-size="20">stuck in export?"</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="604" y="184" width="390" height="280" rx="22" fill="#102720"/>
    <rect x="628" y="212" width="342" height="44" rx="10" fill="#07100f"/>
    <circle cx="652" cy="234" r="6" fill="#ff6b6b"/>
    <circle cx="674" cy="234" r="6" fill="#f5bf55"/>
    <circle cx="696" cy="234" r="6" fill="#66e2bc"/>
    <text x="628" y="298" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">spark-cli</text>
    <text x="628" y="340" fill="#c7d9d1" font-family="JetBrains Mono, Menlo, monospace" font-size="20">config show</text>
    <text x="628" y="372" fill="#c7d9d1" font-family="JetBrains Mono, Menlo, monospace" font-size="20">driver-thread-dump</text>
    <text x="628" y="404" fill="#c7d9d1" font-family="JetBrains Mono, Menlo, monospace" font-size="20">diagnose / app-summary</text>
    <text x="628" y="436" fill="#c7d9d1" font-family="JetBrains Mono, Menlo, monospace" font-size="20">paimon-diagnostics</text>
  </g>

  <path d="M430 326 C500 326 520 326 586 326" stroke="#66e2bc" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <text x="458" y="302" fill="#bff5df" font-family="Inter, Arial, sans-serif" font-size="18">commands</text>

  <g filter="url(#shadow)">
    <rect x="1126" y="170" width="360" height="120" rx="18" fill="#ffffff"/>
    <text x="1154" y="222" fill="#07100f" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">Spark History Server</text>
    <text x="1154" y="258" fill="#52635d" font-family="JetBrains Mono, Menlo, monospace" font-size="18">shs://history:18081</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1126" y="330" width="360" height="120" rx="18" fill="#ffffff"/>
    <text x="1154" y="382" fill="#07100f" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">YARN Web UI</text>
    <text x="1154" y="418" fill="#52635d" font-family="JetBrains Mono, Menlo, monospace" font-size="18">gateway/prod/yarn</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1126" y="490" width="360" height="120" rx="18" fill="#ffffff"/>
    <text x="1154" y="542" fill="#07100f" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">EventLog storage</text>
    <text x="1154" y="578" fill="#52635d" font-family="JetBrains Mono, Menlo, monospace" font-size="18">obs:// or s3:// root</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1126" y="650" width="360" height="120" rx="18" fill="#ffffff"/>
    <text x="1154" y="702" fill="#07100f" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">Paimon diagnostics</text>
    <text x="1154" y="738" fill="#52635d" font-family="JetBrains Mono, Menlo, monospace" font-size="18">thread dump + profiler JSON</text>
  </g>

  <path d="M1006 270 C1052 245 1074 232 1110 230" stroke="#66e2bc" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1006 346 C1050 358 1072 378 1110 388" stroke="#66e2bc" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1006 408 C1056 474 1070 540 1110 550" stroke="#66e2bc" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M994 444 C1060 558 1068 690 1110 710" stroke="#66e2bc" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="330" y="620" width="740" height="144" rx="18" fill="#ffffff"/>
    <text x="366" y="672" fill="#07100f" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Structured answer</text>
    <text x="366" y="712" fill="#52635d" font-family="Inter, Arial, sans-serif" font-size="20">state, strongest evidence, likely cause, missing proof, next command</text>
    <rect x="366" y="734" width="638" height="4" rx="2" fill="url(#accent)"/>
  </g>
  <path d="M710 472 C690 540 690 574 694 604" stroke="#f5bf55" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
</svg>
